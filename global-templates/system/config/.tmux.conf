# Maid Agent System - tmux/psmux 共通設定
# ~/.maid-agent/system/config/.tmux.conf
# InitGlobal で自動配置されます
#
# セッション作成時に source-file で読み込まれます。
# ユーザーの ~/.tmux.conf とは独立した設定です。

# === マウス操作 ===
set -g mouse on

# === 256色対応設定 ===
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# === ウィンドウ名自動変更の無効化 ===
# エージェント名（butler, chief等）がプロセス名で上書きされるのを防止
set-option -g automatic-rename off
set-option -g allow-rename off

# === ステータスバー2行表示 ===
set -g status 2

# 1行目: ウィンドウリスト（クリック可能）
set -g status-format[0] '#[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange],#[range=window|#{window_index} list=focus]#{T:window-status-current-format}#[norange]}'

# 2行目: セッション名、パス、日時
set -g status-format[1] '#[align=left][#{session_name}] #{pane_current_path} #[align=right]%Y-%m-%d %H:%M'
