# Maid Agent Messenger グローバル設定ファイル
# ~/.maid-agent/system/config/maid-agent-messenger.yaml
#
# init Global で既存の設定は保持されます（config は preserveDirs 対象）

# 環境セットアップ状態（InitGlobal完了時に自動設定）
# status: none | target | ready
environments:
  wsl:
    status: none
  windows:
    status: none

server:
  port: 3100
  host: 127.0.0.1

dashboard:
  # エディタのURIスキーム: vscode | windsurf | cursor
  editor: vscode

keepalive:
  # HTTP Keep-Alive タイムアウト（プロキシの60秒より長く設定）
  http_keepalive_timeout: 65000  # 65秒
  http_headers_timeout: 66000    # 66秒

  # サーバー→クライアント Ping間隔（ミリ秒）
  ping_interval: 30000  # 30秒間隔
