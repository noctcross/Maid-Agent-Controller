# MCP Server グローバル設定ファイル
# ~/.maid-agent/system/config/mcp-server.yaml
#
# init Global で既存の設定は保持されます（config は preserveDirs 対象）

server:
  mode: hybrid
  port: 3100
  host: 127.0.0.1

central:
  connection_timeout: 3000
  reconnect_interval: 30000

fallback:
  enabled: true
  auto_recover: true

dashboard:
  # エディタのURIスキーム: vscode | windsurf | cursor
  editor: vscode

keepalive:
  # アイドルセッションのタイムアウト（ミリ秒）
  # この時間リクエストがないセッションは自動的にクリーンアップされる
  session_idle_timeout: 1800000  # 30分

  # セッションGC巡回間隔（ミリ秒）
  gc_interval: 60000  # 1分

  # HTTP Keep-Alive タイムアウト（プロキシの60秒より長く設定）
  http_keepalive_timeout: 65000  # 65秒
  http_headers_timeout: 66000    # 66秒

  # サーバー→クライアント Ping（死活監視）
  ping_enabled: true
  ping_interval: 30000       # 30秒間隔
  ping_timeout: 5000         # 応答待ち5秒
  max_missed_pings: 2        # 2回連続未応答でPing停止（セッションは保全）
