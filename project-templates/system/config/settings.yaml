# Maid Agent Controller 設定ファイル

# マルチプレクサ設定
multiplexer:
  # type: tmux / psmux / auto
  # tmux: tmuxを使用（デフォルト、WSL環境等）
  # psmux: psmuxを使用（PowerShell環境）
  # auto: 環境変数・コマンド存在で自動検出
  type: tmux

# 言語設定
# ja: メイド口調の日本語
# en: 英語（メイド口調 + 英訳）
# es, zh, ko, fr, de: その他の言語
language: ja

# エージェント設定
agents:
  butler:
    name: "執事"
    emoji: "🎩"
  chief:
    name: "メイド長"
    emoji: "👑"
  maids:
    - name: "エマ"
      id: "emma"
      emoji: "☕"
      specialty: "コードレビュー"
    - name: "ソフィア"
      id: "sophia"
      emoji: "❄️"
      specialty: "ドキュメント作成"
    - name: "リリー"
      id: "lily"
      emoji: "🎀"
      specialty: "テスト実行"
    - name: "ローズ"
      id: "rose"
      emoji: "🌹"
      specialty: "リファクタリング"
    - name: "アリス"
      id: "alice"
      emoji: "✨"
      specialty: "調査・分析"
    - name: "メイ"
      id: "may"
      emoji: "🕊️"
      specialty: "バグ修正"
    - name: "フローラ"
      id: "flora"
      emoji: "🌿"
      specialty: "新機能実装"
    - name: "ルナ"
      id: "luna"
      emoji: "🌙"
      specialty: "設定・環境構築"

# LLMプロバイダ設定（省略時: Anthropic 直契約）
# type: anthropic / bedrock / vertex / custom
#
# provider:
#   type: anthropic     # デフォルト（何も設定しない場合と同じ）
#
# # Amazon Bedrock を使う場合:
# provider:
#   type: bedrock
#   bedrock:
#     region: us-east-1
#     profile: my-aws-profile   # AWS SSO 使用時
#     base_url: ""              # カスタムエンドポイント（省略可）
#
# # Google Vertex AI を使う場合:
# provider:
#   type: vertex
#   vertex:
#     project_id: my-gcp-project
#     region: global
#     base_url: ""              # カスタムエンドポイント（省略可）
#
# # LiteLLM 等のゲートウェイ経由（非公式）:
# provider:
#   type: custom
#   custom:
#     base_url: https://your-gateway.example.com/v1
#     auth_token_env: ANTHROPIC_AUTH_TOKEN  # トークンを参照する環境変数名
#
# # ロール別・エージェント個別に provider を切り替える場合:
# # 解決優先順位: agents[agentId] > roles[role] > グローバルデフォルト（type）
# provider:
#   type: anthropic     # グローバルデフォルト
#   roles:
#     butler:           # 執事のみ Bedrock を使う場合
#       type: bedrock
#       bedrock:
#         region: us-east-1
#     chief:            # メイド長のみ別プロバイダにする場合
#       type: anthropic
#     maid:             # 全メイドに Vertex AI を使う場合
#       type: vertex
#       vertex:
#         project_id: my-gcp-project
#         region: global
#   agents:
#     emma:             # emma だけカスタムゲートウェイを使う場合
#       type: custom
#       custom:
#         base_url: https://gateway.example.com/v1
#         auth_token_env: ANTHROPIC_AUTH_TOKEN

# LLMモデル設定（省略時: Claude Codeのデフォルトモデルを使用）
# model:
#   # 全エージェント共通のデフォルト
#   default: "sonnet"
#
#   # 役割別の指定（省略可、デフォルトより優先）
#   roles:
#     butler: "opus"       # 執事: 戦略立案に高性能モデル
#     chief: "sonnet"      # メイド長: バランス型
#     maid: "haiku"        # メイド: コスト効率重視
#
#   # エージェント個別の指定（省略可、役割別より優先）
#   agents:
#     emma: "sonnet"       # 特定メイドだけ別モデルにする場合

# スキル設定
skills:
  # グローバル保存先（ユーザーホーム配下、全プロジェクト共有）
  global_path: "~/.claude/skills/maid-generated/"
  # プロジェクト固有のスキル保存先
  local_path: ".maid-agent/.claude/skills/"

# スクリーンショット設定（OS別）
screenshot:
  # Windows側のパス（参考用）
  windows_path: "C:\\Users\\{{USERNAME}}\\Pictures\\Screenshots"
  # WSLからアクセスするパス
  wsl_path: "/mnt/c/Users/{{USERNAME}}/Pictures/Screenshots"
  # macOS（デスクトップがデフォルト保存先）
  macos_path: "~/Desktop"
  # Linux（一般的なスクリーンショット保存先）
  linux_path: "~/Pictures/Screenshots"

# 通知設定
notify:
  # チャンク分割の上限（flush-notify-queue.sh が使用）
  # notify 単位で数えるため件数は少なめ・文字数は send-keys 安全上限（~4KB）内で余裕を持って設定
  batch_chunk_count: 5    # 1チャンクあたりの最大 notify 件数（旧: 8）
  batch_chunk_chars: 3500 # 1チャンクあたりの最大文字数（旧: 1000 → 3500 に引き上げ・task-973）

# ログ設定
log:
  # debug, info, warn, error
  level: info
  path: ".maid-agent/logs/"

# Memory MCP設定（利用可能な場合）
memory:
  # Memory MCPを使用するか
  enabled: true
  # 知識グラフの保存先
  graph_path: "~/.claude/memory/"

# 品質チェック設定（自己改善ループ）
quality_check:
  # 品質チェックを有効にするか
  enabled: true

  # チェックレベル
  # strict: 全チェック項目を必須化（差し戻し多め）
  # standard: 形式チェック必須、内容チェックは警告のみ
  # relaxed: 形式チェックのみ（差し戻し少なめ）
  level: standard

  # 最大リトライ回数（無限ループ防止）
  max_retry: 5

  # タスク種別ごとの追加チェック
  # task: 親タスク（基本形式のみ）
  # work: 実装作業（変更ファイル必須）
  # step: 細分化タスク（変更ファイル必須）
  # investigation: 調査タスク（詳細な調査結果必須）

  # LLMチェック設定
  llm_check:
    enabled: true
    model: "haiku"
    on_failure: "warn"
    timeout: 60
    score_threshold: 60
    task_types:
      - investigation
      - design
      - proposal
      - document
      - work
      - step
      - review
    advanced:
      debug: false

  # 問題分類設定
  classification:
    enabled: true
    model: "haiku"
    timeout: 60
    # confidence閾値
    confidence_auto_threshold: 80    # 80以上: 自動承認
    confidence_review_threshold: 50  # 50-79: 要レビュー、50未満: 即確認
