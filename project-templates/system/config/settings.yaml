# Maid Agent Controller 設定ファイル

# 言語設定
# ja: メイド口調の日本語
# en: 英語（メイド口調 + 英訳）
# es, zh, ko, fr, de: その他の言語
language: ja

# エージェント設定
agents:
  butler:
    name: "執事"
    emoji: "🎩"
  chief:
    name: "メイド長"
    emoji: "👑"
  maids:
    - name: "エマ"
      id: "emma"
      emoji: "☕"
      specialty: "コードレビュー"
    - name: "ソフィア"
      id: "sophia"
      emoji: "❄️"
      specialty: "ドキュメント作成"
    - name: "リリー"
      id: "lily"
      emoji: "🎀"
      specialty: "テスト実行"
    - name: "ローズ"
      id: "rose"
      emoji: "🌹"
      specialty: "リファクタリング"
    - name: "アリス"
      id: "alice"
      emoji: "✨"
      specialty: "調査・分析"
    - name: "メイ"
      id: "may"
      emoji: "🕊️"
      specialty: "バグ修正"
    - name: "フローラ"
      id: "flora"
      emoji: "🌿"
      specialty: "新機能実装"
    - name: "ルナ"
      id: "luna"
      emoji: "🌙"
      specialty: "設定・環境構築"

# LLMモデル設定（省略時: Claude Codeのデフォルトモデルを使用）
# model:
#   # 全エージェント共通のデフォルト
#   default: "sonnet"
#
#   # 役割別の指定（省略可、デフォルトより優先）
#   roles:
#     butler: "opus"       # 執事: 戦略立案に高性能モデル
#     chief: "sonnet"      # メイド長: バランス型
#     maid: "haiku"        # メイド: コスト効率重視
#
#   # エージェント個別の指定（省略可、役割別より優先）
#   agents:
#     emma: "sonnet"       # 特定メイドだけ別モデルにする場合

# スキル設定
skills:
  # グローバル保存先（ユーザーホーム配下、全プロジェクト共有）
  global_path: "~/.claude/skills/maid-generated/"
  # プロジェクト固有のスキル保存先
  local_path: ".maid-agent/agents/skills/"

# スクリーンショット設定（OS別）
screenshot:
  # Windows側のパス（参考用）
  windows_path: "C:\\Users\\{{USERNAME}}\\Pictures\\Screenshots"
  # WSLからアクセスするパス
  wsl_path: "/mnt/c/Users/{{USERNAME}}/Pictures/Screenshots"
  # macOS（デスクトップがデフォルト保存先）
  macos_path: "~/Desktop"
  # Linux（一般的なスクリーンショット保存先）
  linux_path: "~/Pictures/Screenshots"

# ログ設定
log:
  # debug, info, warn, error
  level: info
  path: ".maid-agent/logs/"

# Memory MCP設定（利用可能な場合）
memory:
  # Memory MCPを使用するか
  enabled: true
  # 知識グラフの保存先
  graph_path: "~/.claude/memory/"
